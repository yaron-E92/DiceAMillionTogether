name: Relay checks
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  relay-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          bash -n mod/build.sh
          python3 -m py_compile relay/server.py relay/test_relay.py
      - name: Two-peer relay test
        shell: bash
        run: |
          set -euo pipefail
          python3 relay/server.py > relay.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; cat relay.log' EXIT
          for i in {1..30}; do
            if python3 -c 'import socket; s=socket.create_connection(("127.0.0.1",7777),0.2); s.close()' 2>/dev/null; then break; fi
            sleep 0.2
          done
          python3 relay/test_relay.py
