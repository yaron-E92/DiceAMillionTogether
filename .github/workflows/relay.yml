name: .NET co-op checks

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check build script
        run: bash -n mod/build.sh
      - name: Build .NET relay and engine
        run: dotnet build tests/DiceAMillionTogether.SmokeTests/DiceAMillionTogether.SmokeTests.csproj -c Release --nologo
      - name: Build Steam bridge (real Steamworks API)
        run: dotnet build src/DiceAMillionTogether.SteamBridge/DiceAMillionTogether.SteamBridge.csproj -c Release --nologo
      - name: Package Windows Steam bridge
        run: dotnet publish src/DiceAMillionTogether.SteamBridge/DiceAMillionTogether.SteamBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o steam-bridge-dist
      - name: Run relay integration and cross-hand scoring tests
        run: dotnet run --project tests/DiceAMillionTogether.SmokeTests/DiceAMillionTogether.SmokeTests.csproj -c Release --no-build
      - name: Upload Windows Steam bridge (no game files)
        uses: actions/upload-artifact@v4
        with:
          name: steam-bridge-win-x64
          path: steam-bridge-dist/
          retention-days: 7
